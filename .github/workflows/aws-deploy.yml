name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AWS runtime config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AI_SERVICE_BASE_URL: ${{ secrets.AI_SERVICE_BASE_URL }}
        run: |
          node -e "const fs=require('fs'); const cfg={ apiBaseUrl: process.env.API_BASE_URL||'', aiServiceBaseUrl: process.env.AI_SERVICE_BASE_URL||'' }; fs.mkdirSync('src/assets',{recursive:true}); fs.writeFileSync('src/assets/env.js', 'window.__APP_CONFIG__ = '+JSON.stringify(cfg)+';\\n');"

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Upload to S3
        run: aws s3 sync dist/workflow-ui "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
